<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JumpEye</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>JumpEye</h1>
  <div class="subtitle">Jump. Get counted. Get taller (probably).</div>

  <div class="layout">
    <div class="video-wrap">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div class="goal-hit-overlay" id="goalOverlay">
        <svg class="checkmark" viewBox="0 0 100 100">
          <circle class="checkmark-circle" cx="50" cy="50" r="42" />
          <polyline class="checkmark-check" points="30,52 44,66 72,34" />
        </svg>
      </div>
    </div>

    <div class="panel">
      <div class="stat-block">
        <div class="count" id="countDisplay">0</div>
        <div class="count-label" id="countLabel">jumps</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>

      <div class="goal-input-row">
        <div style="flex:1">
          <label for="goalInput">Goal</label>
          <input type="number" id="goalInput" min="1" value="20" />
        </div>
      </div>

      <div>
        <label>Skeleton view</label>
        <div class="display-toggle">
          <button id="modeSkeleton" class="active">Skeleton</button>
          <button id="modeBox">Box</button>
        </div>
      </div>

      <div class="sensitivity-row">
        <div class="sensitivity-label-row">
          <label for="sensitivity">Sensitivity</label>
          <span class="sensitivity-value" id="sensitivityValue">0.18</span>
        </div>
        <input type="range" id="sensitivity" min="0.08" max="0.35" step="0.01" value="0.18" />
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="startBtn">Start camera</button>
        <button class="btn-secondary" id="resetBtn">Reset</button>
      </div>

      <div class="status-line" id="statusLine">Click "Start camera" to begin.</div>
    </div>
  </div>

  <footer>Runs entirely in your browser — video never leaves your device.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.20.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.20.0/dist/tf-converter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.20.0/dist/tf-backend-webgl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
